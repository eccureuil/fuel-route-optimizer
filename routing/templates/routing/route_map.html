<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Route Map - Spotter.ai</title>
    <!-- Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Overlay search panel top-left */
        .search-box {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 340px;
            backdrop-filter: blur(5px);
            max-height: 85vh;
            overflow-y: auto;
        }

        .search-box h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #2c3e50;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #7f8c8d;
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        .search-btn {
            width: 100%;
            padding: 10px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #219150;
        }

        .search-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        /* Status box (loading / errors) */
        #status-msg {
            margin-top: 10px;
            font-size: 13px;
            display: none;
            padding: 8px;
            border-radius: 5px;
        }

        .status-loading {
            background: #f39c12;
            color: white;
        }

        .status-error {
            background: #e74c3c;
            color: white;
        }

        .status-success {
            background: #27ae60;
            color: white;
        }

        /* Route summary panel */
        #route-summary {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #ecf0f1;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }

        #route-summary h4 {
            margin: 0 0 8px 0;
            color: #2c3e50;
            font-size: 14px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 4px 0;
            color: #34495e;
        }

        .summary-row strong {
            color: #2c3e50;
        }

        /* Fuel stops list */
        #fuel-stops-list {
            display: none;
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
        }

        .stop-item {
            padding: 8px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .stop-item:hover {
            background: #f5f5f5;
        }

        .stop-item:last-child {
            border-bottom: none;
        }

        .stop-number {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-weight: bold;
            margin-right: 8px;
            font-size: 11px;
        }

        .stop-name {
            font-weight: 600;
            color: #2c3e50;
        }

        .stop-details {
            color: #7f8c8d;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- Search Form & Results -->
    <div class="search-box">
        <h3>📍 Route Calculation</h3>
        <form id="route-form">
            <div class="input-group">
                <label for="start-input">Start:</label>
                <input type="text" id="start-input" placeholder="e.g., New York, NY" required>
            </div>
            <div class="input-group">
                <label for="finish-input">Finish:</label>
                <input type="text" id="finish-input" placeholder="e.g., Los Angeles, CA" required>
            </div>
            <button type="submit" class="search-btn" id="calculate-btn">🔍 Calculate Route</button>
        </form>
        <div id="status-msg"></div>

        <!-- Route Summary -->
        <div id="route-summary">
            <h4>📊 Route Summary</h4>
            <div class="summary-row">
                <span>Distance:</span>
                <strong><span id="summary-distance">0</span> miles</strong>
            </div>
            <div class="summary-row">
                <span>Fuel Needed:</span>
                <strong><span id="summary-gallons">0</span> gal</strong>
            </div>
            <div class="summary-row">
                <span>Total Cost:</span>
                <strong>$<span id="summary-cost">0</span></strong>
            </div>
            <div class="summary-row">
                <span>Avg Price/Gal:</span>
                <strong>$<span id="summary-avg-price">0</span></strong>
            </div>
            <div class="summary-row">
                <span>Fuel Stops:</span>
                <strong><span id="summary-stops">0</span> stops</strong>
            </div>
        </div>

        <!-- Fuel Stops List -->
        <div id="fuel-stops-list"></div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script>
        mapboxgl.accessToken = '{{ mapbox_access_token }}';

        const form = document.getElementById('route-form');
        const startInput = document.getElementById('start-input');
        const finishInput = document.getElementById('finish-input');
        const calculateBtn = document.getElementById('calculate-btn');
        const statusMsg = document.getElementById('status-msg');
        const routeSummary = document.getElementById('route-summary');
        const fuelStopsList = document.getElementById('fuel-stops-list');

        let currentMarkers = [];
        let currentRouteData = null;

        // Pre-fill fields with URL parameters if they exist, otherwise fallback to defaults
        const urlParams = new URLSearchParams(window.location.search);
        const initialStart = urlParams.get('start') || 'New York, NY';
        const initialFinish = urlParams.get('finish') || 'Los Angeles, CA';

        startInput.value = initialStart;
        finishInput.value = initialFinish;

        function showStatus(msg, type = 'loading') {
            statusMsg.innerText = msg;
            statusMsg.className = `status-${type}`;
            statusMsg.style.display = 'block';
        }

        function hideStatus() {
            statusMsg.style.display = 'none';
        }

        function formatNumber(num) {
            return Number(num).toFixed(2);
        }

        // Initialize the interactive map
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-98.5795, 39.8283],
            zoom: 4
        });

        // Function to render route summary and stops list
        function renderSummary(apiData) {
            const data = apiData.data;

            document.getElementById('summary-distance').innerText = formatNumber(data.total_distance_miles);
            document.getElementById('summary-gallons').innerText = formatNumber(data.total_fuel_gallons);
            document.getElementById('summary-cost').innerText = formatNumber(data.total_fuel_cost);
            document.getElementById('summary-avg-price').innerText = formatNumber(data.avg_price_per_gallon);
            document.getElementById('summary-stops').innerText = data.number_of_fuel_stops;

            routeSummary.style.display = 'block';

            // Render fuel stops list
            fuelStopsList.innerHTML = '';
            data.fuel_stops.forEach((stop, index) => {
                const stopDiv = document.createElement('div');
                stopDiv.className = 'stop-item';
                stopDiv.innerHTML = `
                    <div>
                        <span class="stop-number">${stop.stop_number}</span>
                        <span class="stop-name">${stop.name}</span>
                    </div>
                    <div class="stop-details">
                        ${stop.city}, ${stop.state} | 
                        ${formatNumber(stop.gallons_purchased)} gal @ $${formatNumber(stop.price_per_gallon)}/gal = $${formatNumber(stop.cost_dollars)}
                    </div>
                `;

                // Click to zoom to marker
                stopDiv.addEventListener('click', () => {
                    const coords = [stop.coordinates.longitude, stop.coordinates.latitude];
                    map.flyTo({ center: coords, zoom: 13, duration: 1000 });
                    currentMarkers[index].togglePopup();
                });

                fuelStopsList.appendChild(stopDiv);
            });

            fuelStopsList.style.display = 'block';
        }

        // Function to query the Django API and update the map
        async function fetchAndRenderRoute(start, finish) {
            showStatus('⏳ Calculating route and optimizing...', 'loading');
            calculateBtn.disabled = true;

            // Clear existing markers
            currentMarkers.forEach(marker => marker.remove());
            currentMarkers = [];
            fuelStopsList.style.display = 'none';
            routeSummary.style.display = 'none';

            try {
                // DEBUG: Log the API URL
                const apiUrl = `/api/route/?start=${encodeURIComponent(start)}&finish=${encodeURIComponent(finish)}`;
                console.log('🔗 Calling API URL:', apiUrl);

                const response = await fetch(apiUrl);

                // DEBUG: Log response status
                console.log('📊 Response Status:', response.status, response.statusText);
                console.log('📋 Response Headers:', {
                    'content-type': response.headers.get('content-type')
                });

                if (!response.ok) {
                    // DEBUG: Get response text to see what's returned
                    const responseText = await response.text();
                    console.error('❌ Error Response (first 500 chars):', responseText.substring(0, 500));
                    throw new Error(`Error : ${response.status} ${response.statusText}`);
                }

                // DEBUG: Get text first to see if it's valid JSON
                const responseText = await response.text();
                console.log('📝 Raw Response (first 500 chars):', responseText.substring(0, 500));

                // Try to parse JSON
                let apiData;
                try {
                    apiData = JSON.parse(responseText);
                    console.log('✅ Valid JSON received');
                } catch (e) {
                    console.error('❌ Invalid JSON:', e.message);
                    console.error('Response was:', responseText.substring(0, 1000));
                    throw new Error('Server returned invalid JSON. Check browser console for details.');
                }

                // DEBUG: Log API response
                console.log('📦 API Response:', apiData);

                // Check API status
                if (apiData.status === 'error') {
                    console.warn('⚠️  API returned error:', apiData.message);
                    throw new Error(apiData.message);
                }

                const data = apiData.data;
                currentRouteData = apiData;

                console.log('✅ Route data received successfully');
                console.log('   - Distance:', data.total_distance_miles, 'miles');
                console.log('   - Stops:', data.number_of_fuel_stops);
                console.log('   - Cost: $' + data.total_fuel_cost);

                // 1. Update route geometry line
                if (map.getSource('route-source')) {
                    map.getSource('route-source').setData(data.route_geometry);
                } else {
                    map.addSource('route-source', {
                        'type': 'geojson',
                        'data': data.route_geometry
                    });

                    map.addLayer({
                        'id': 'route-layer',
                        'type': 'line',
                        'source': 'route-source',
                        'layout': { 'line-join': 'round', 'line-cap': 'round' },
                        'paint': { 'line-color': '#007cbf', 'line-width': 5 }
                    });
                }

                // 2. Automatically adjust map viewport to fit the complete route
                const coordinates = data.route_geometry.coordinates;
                const bounds = coordinates.reduce(
                    (b, coord) => b.extend(coord),
                    new mapboxgl.LngLatBounds(coordinates[0], coordinates[0])
                );
                map.fitBounds(bounds, { padding: 80 });

                // 3. Add interactive markers for each optimized fuel station
                data.fuel_stops.forEach((stop, index) => {
                    const popupContent = `
                        <div style="color:#333; font-size: 13px;">
                            <h4 style="margin:0 0 8px 0; color: #2c3e50;"><strong>Stop ${stop.stop_number}</strong></h4>
                            <p style="margin:0 0 4px 0;"><b>${stop.name}</b></p>
                            <p style="margin:0 0 4px 0;">${stop.address}</p>
                            <p style="margin:0 0 4px 0;"><b>City:</b> ${stop.city}, ${stop.state}</p>
                            <hr style="margin: 6px 0; border: none; border-top: 1px solid #ecf0f1;">
                            <p style="margin:0 0 4px 0;"><b>Price:</b> $${formatNumber(stop.price_per_gallon)}/gal</p>
                            <p style="margin:0 0 4px 0;"><b>Fuel:</b> ${formatNumber(stop.gallons_purchased)} gal</p>
                            <p style="margin:0 0 4px 0;"><b>Cost:</b> $${formatNumber(stop.cost_dollars)}</p>
                            <p style="margin:0 0 4px 0;"><b>From Start:</b> ${formatNumber(stop.distance_from_start_miles)} mi</p>
                            <p style="margin:0;"><b>From Previous:</b> ${formatNumber(stop.distance_from_previous_miles)} mi</p>
                        </div>
                    `;

                    const marker = new mapboxgl.Marker({ color: '#e74c3c' })
                        .setLngLat([stop.coordinates.longitude, stop.coordinates.latitude])
                        .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(popupContent))
                        .addTo(map);

                    currentMarkers.push(marker);
                });

                // 4. Render summary and stops list
                renderSummary(apiData);

                // 5. Show success message
                showStatus(apiData.message, 'success');

                // 6. Update browser address bar dynamically
                const newUrl = `${window.location.pathname}?start=${encodeURIComponent(start)}&finish=${encodeURIComponent(finish)}`;
                window.history.pushState({ path: newUrl }, '', newUrl);

            } catch (err) {
                console.error('❌ Route optimization failed:', err);
                console.error('   Error Message:', err.message);
                console.error('   Stack:', err.stack);
                
                // Show helpful error message
                let errorMsg = err.message;
                if (err.message.includes('Unexpected token')) {
                    errorMsg = '❌ Server returned HTML instead of JSON. Check that API endpoint is correct in urls.py';
                } else if (err.message.includes('HTTP Error 404')) {
                    errorMsg = '❌ API endpoint not found (/api/fuel-route/). Check urls.py';
                } else if (err.message.includes('HTTP Error 500')) {
                    errorMsg = '❌ Server error. Check Django console for details';
                }
                
                showStatus(errorMsg, 'error');
                routeSummary.style.display = 'none';
                fuelStopsList.style.display = 'none';
            } finally {
                calculateBtn.disabled = false;
            }
        }

        // Initial map load
        map.on('load', () => {
            console.log('🗺️  Map loaded successfully');
            console.log('🔧 Mapbox token set:', !!mapboxgl.accessToken);
            console.log('📍 Initial route: ' + initialStart + ' → ' + initialFinish);
            fetchAndRenderRoute(initialStart, initialFinish);
        });

        // Form submission event listener
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const start = startInput.value.trim();
            const finish = finishInput.value.trim();

            if (start && finish) {
                fetchAndRenderRoute(start, finish);
            }
        });
    </script>
</body>
</html>
